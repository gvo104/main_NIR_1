[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nir-stage0"
version = "0.1.0"
description = "Technical smoke-test harness for ERA and AIDE"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "openai>=1.69,<4",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3,<9.1",
]
aide = [
    "anthropic>=0.86",
    "backoff>=2.2",
    "black~=26.3.1",
    "coolname>=2.2",
    "dataclasses-json>=0.6.4",
    "funcy==2.0",
    "genson>=1.2",
    "humanize==4.8.0",
    "igraph>=0.11.3",
    "jsonschema==4.19.2",
    "loguru==0.7.2",
    "numpy==1.26.2",
    "omegaconf>=2.3.0",
    "pandas==2.1.4",
    "requests>=2.32.4",
    "rich==13.7.0",
    "scikit-learn==1.5.0",
    "scipy==1.11.4",
    "shutup>=0.2.0",
    "tqdm==4.66.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests/stage0", "tests/stage1"]
addopts = "-m 'not live_llm'"
markers = [
    "docker: requires a working Docker daemon and the stage0 executor image",
    "live_llm: performs calls to the configured real LLM endpoint",
]
